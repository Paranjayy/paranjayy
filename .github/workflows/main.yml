name: Profile Sync

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'metrics/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: profile-sync
  cancel-in-progress: true

jobs:
  readme:
    name: Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install requests

      - name: Update Monkeytype Card
        run: python scripts/update_monkeytype.py

      - name: Update Volt.fm Intelligence
        run: python scripts/update_volt.py

      - name: Update Dynamic Profile Sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Update Star Badges
        run: |
          RESULT=$(curl -s -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" \
            -X POST -d '{"query":"query { user(login: \"paranjayy\") { repositories(first: 100, ownerAffiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]) { nodes { stargazerCount } } starredRepositories { totalCount } } }"}' \
            https://api.github.com/graphql)

          GIVEN=$(echo $RESULT | jq '.data.user.starredRepositories.totalCount')
          RECEIVED=$(echo $RESULT | jq '.data.user.repositories.nodes | map(.stargazerCount) | add')

          if [ -z "$GIVEN" ] || [ "$GIVEN" == "null" ]; then GIVEN=0; fi
          if [ -z "$RECEIVED" ] || [ "$RECEIVED" == "null" ]; then RECEIVED=0; fi

          GIVEN_BADGE='  <img src="https://img.shields.io/badge/Starred-'"$GIVEN"'-065f46?logo=github&logoColor=white" alt="Starred Repos" />'
          sed -i "/<!-- STARRED_COUNT -->/,/<!-- \/STARRED_COUNT -->/{ /<!-- STARRED_COUNT -->/!{ /<!-- \/STARRED_COUNT -->/!d; }; }" README.md
          sed -i "/<!-- STARRED_COUNT -->/a $GIVEN_BADGE" README.md

          RECEIVED_BADGE='  <img src="https://img.shields.io/badge/Stars-'"$RECEIVED"'-fbbf24?logo=github&logoColor=black" alt="GitHub Stars" />'
          sed -i "/<!-- TOTAL_STARS -->/,/<!-- \/TOTAL_STARS -->/{ /<!-- TOTAL_STARS -->/!{ /<!-- \/TOTAL_STARS -->/!d; }; }" README.md
          sed -i "/<!-- TOTAL_STARS -->/a $RECEIVED_BADGE" README.md

      - name: Commit & Push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md metrics/
          git commit -m "chore: sync profile data" || echo "No changes to commit"
          git pull --rebase origin main 2>/dev/null || true
          git push